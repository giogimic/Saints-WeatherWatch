
services:
  frontend:
    build:
      context: ./frontend
    container_name: weatherwatch_frontend
    restart: unless-stopped
    ports:
      - "5080:80"

  backend:
    build:
      context: ./backend
      args:
        - DB_PROVIDER=${DB_PROVIDER:-sqlite}
    container_name: weatherwatch_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/weatherwatch.db}
      - PORT=8080
    ports:
      - "5081:8080"
    volumes:
      - weatherwatch_db:/app

  mariadb:
    image: mariadb:10.11
    container_name: weatherwatch_mariadb
    restart: unless-stopped
    profiles:
      - mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-supersecret}
      MARIADB_DATABASE: weatherwatch
    ports:
      - "5082:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  weatherwatch_db:
  mariadb_data:
